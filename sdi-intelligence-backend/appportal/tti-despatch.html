<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0b">
<title>TTI Despatch · SDI Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
<style>
/* ── we.are.sdi (9 Nov 2026, SCRUM-195): the app portal's look, as index.html has it. The wordmark
   with its two yellow dots, Outfit headings, Inter text, JetBrains Mono labels, pill buttons and the
   short yellow line over each panel. Amber stays the warning colour, so a warning never reads as
   brand; red stays "check this". Dark only, as before. */
:root{
  --bg:#0c0c0b; --panel:#141412; --panel-2:#1a1a17; --line:#2b2b26; --line-soft:#21211d;
  --ink:#f2f2ea; --muted:#b6b6a7; --dim:#8f8f84;
  --brand:#F6D946; --brand-fill:#F6D946; --ok:#4ec97f; --warn:#e8a33d; --bad:#ff6b6b;
  --disp:'Outfit','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --serif-disp:'Fraunces',Georgia,serif;
  --r:10px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
     -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}a{color:var(--brand)}button{cursor:pointer}
button:disabled{cursor:wait;opacity:.55}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.sdi-word{display:inline-block;height:1em;width:auto;vertical-align:-.12em;color:var(--ink)}
.sdi-word .d{fill:var(--brand)}
.sdi-dots{position:absolute;pointer-events:none;border-radius:50%;opacity:.16;z-index:0;
  background-image:radial-gradient(var(--brand) 1.1px, transparent 1.6px);background-size:9px 9px;
  -webkit-mask-image:radial-gradient(circle at center,#000 58%,transparent 71%);
          mask-image:radial-gradient(circle at center,#000 58%,transparent 71%)}

/* ── Header: the wordmark, a divider, the app's name; the way back as the portal's back control ── */
.top{position:sticky;top:0;z-index:20;background:rgba(12,12,11,.9);
     backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
     padding:calc(14px + var(--safe-t)) 22px 14px}
.top .in{max-width:1056px;margin:0 auto}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;min-height:34px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .sdi-word{height:22px}
.brand .pipe{width:1px;height:20px;background:var(--line);flex:none}
.brand .lbl{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.22em;
     color:var(--brand);text-transform:uppercase;white-space:nowrap}
.topnav{margin-left:auto;display:flex;align-items:center;gap:20px}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-family:var(--body);
      font-size:14px;padding:6px 2px;text-decoration:none;white-space:nowrap}
.back svg{width:17px;height:17px;flex:none}
.back:hover{color:var(--ink)}

main{max-width:1100px;margin:0 auto;padding:22px 22px calc(70px + var(--safe-b))}
.hero{position:relative;max-width:860px;padding:6px 0 2px}
.hero > :not(.sdi-dots){position:relative;z-index:1}
.hero .sdi-dots{width:240px;height:240px;right:-70px;top:-70px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;
         letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--brand);flex:none}
h1{font-family:var(--disp);font-weight:600;font-size:clamp(26px,4.2vw,38px);line-height:1.12;
   letter-spacing:-.015em;margin:12px 0 8px}
p{margin:0}.hint{color:var(--muted);font-size:14px;margin-top:6px}
.hero .hint{font-size:14.5px;max-width:640px}

/* ── Tabs: pills, the chosen one in SDI yellow ── */
.tabs{display:flex;gap:6px;margin:24px 0 16px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--body);
     font-size:13px;font-weight:500;padding:7px 13px;border-radius:999px;white-space:nowrap;
     transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:var(--ink);border-color:var(--muted)}
.tab[aria-selected=true]{color:var(--brand);background:rgba(246,217,70,.1);border-color:rgba(246,217,70,.55)}

/* ── The question's controls ── */
.tools{display:flex;gap:10px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
input[type=date],input[type=search],input[type=number],select{background:var(--panel);
     border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 16px;min-height:44px;
     font-family:var(--body);font-size:15px;transition:border-color .15s}
input[type=number]{padding:10px 10px 10px 14px}
input::placeholder{color:var(--dim)}
input:focus,select:focus{outline:none;border-color:var(--brand)}
input[type=search]{flex:1 1 220px;min-width:0}
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
     padding:9px 18px;border-radius:999px;font-family:var(--disp);font-size:14.5px;font-weight:600;
     line-height:1.25;text-decoration:none;transition:filter .15s,border-color .15s}
.primary{background:var(--brand-fill);color:#000;border:1px solid var(--brand-fill)}
.primary:hover{filter:brightness(1.06)}
.dayhead{font-size:17px;margin:26px 0 10px;border-bottom:1px solid var(--line-soft);padding-bottom:8px}
a.primary{margin-right:8px}
.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.secondary:hover{border-color:var(--muted)}

/* ── The answer ── */
.status{position:relative;min-height:48px;padding:13px 16px;border:1px solid var(--line);background:var(--panel);
        border-radius:var(--r);color:var(--muted);margin-bottom:16px}
.status::before,.card::before,.caveat::before{content:"";position:absolute;top:-1px;left:16px;width:30px;
        height:2px;background:var(--brand);border-radius:0 0 2px 2px}
.status.ok{border-color:rgba(78,201,127,.5);background:rgba(78,201,127,.06);color:var(--ink)}
.status.ok::before{background:var(--ok)}
.status.error{border-color:rgba(255,107,107,.6);background:rgba(255,107,107,.06);color:var(--ink)}
.status.error::before{background:var(--bad)}
.card{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);
      padding:16px 16px 14px;margin-bottom:10px}
.card > p{margin-top:4px}
.card h3{margin:0 0 4px;font-family:var(--disp);font-weight:600;font-size:16.5px;line-height:1.3;
         letter-spacing:-.005em}
.card > .primary,.card > .secondary{margin:10px 8px 4px 0;min-height:38px;padding:7px 16px;font-size:14px}
.card p > .primary,.card p > .secondary{margin:6px 8px 2px 0;min-height:38px;padding:7px 16px;font-size:14px}
.meta{color:var(--muted);font-size:12.5px;font-family:var(--mono);line-height:1.6;word-break:break-word}
.because{color:var(--warn);font-size:14px;margin-top:4px}
.flag{display:inline-block;vertical-align:3px;font-family:var(--mono);font-size:9.5px;font-weight:500;
      letter-spacing:.09em;text-transform:uppercase;line-height:1.5;white-space:nowrap;
      border:1px solid rgba(232,163,61,.5);background:rgba(232,163,61,.1);color:var(--warn);
      border-radius:999px;padding:2px 9px;margin-left:8px}
.flag.bad{border-color:rgba(255,107,107,.6);background:rgba(255,107,107,.1);color:var(--bad)}
.flag.good{border-color:rgba(78,201,127,.5);background:rgba(78,201,127,.1);color:var(--ok)}
.caveat{position:relative;border:1px solid rgba(232,163,61,.35);background:rgba(232,163,61,.06);
        border-radius:var(--r);padding:14px 16px;margin:16px 0}
.caveat::before{background:var(--warn)}
.caveat > p + p{margin-top:6px}
.unresolved{border-left:3px solid var(--bad)}
.card.unresolved::before{background:var(--bad)}
h2{font-family:var(--disp);font-weight:600;font-size:17px;line-height:1.3;letter-spacing:-.005em;margin:26px 0 10px}
h2 .n{color:var(--dim);font-weight:400;font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;
      white-space:nowrap}
.tools .hint{margin-top:0}
/* A sheet of the project tracker: a label, as the portal's group headings */
#out > h3{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;font-weight:500;
          letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
#out > h3::before{content:"";width:18px;height:2px;background:var(--brand);flex:none}
details{margin-top:12px}summary{cursor:pointer;color:var(--warn);padding:6px 0;font-size:14.5px}
details > .card:first-of-type{margin-top:8px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
    overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;margin:0;
    color:var(--ink)}
.footrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px;
         padding-top:16px;border-top:1px solid var(--line-soft)}
.foot{color:var(--dim);font-size:11px;font-family:var(--mono);letter-spacing:.04em;line-height:1.6}
.footrow .sdi-word{height:13px;color:var(--muted);flex:none;margin-left:auto}

@media(max-width:700px){
  .top{padding:calc(12px + var(--safe-t)) 16px 8px}
  .topnav{margin-left:0;width:100%;justify-content:space-between}
  main{padding:18px 16px calc(60px + var(--safe-b))}
  .hero .sdi-dots{width:190px;height:190px;right:-16px;top:-56px}
  .tabs{gap:6px;margin-top:20px}.tab{padding:6px 12px;font-size:13px}
  .footrow{flex-wrap:wrap}
}
</style></head>

145.847Z"/><path class="d" d="M650.643 145.691H669.084V164.002H650.643V145.691Z"/></svg></div>
</main>
<script>
const $ = id => document.getElementById(id);
const el = (tag, text, parent, cls) => { const n = document.createElement(tag);
  if(text != null) n.textContent = text; if(cls) n.className = cls;
  if(parent) parent.append(n); return n; };
const some = n => n + (n === 1 ? " line" : " lines");
const have = n => n === 1 ? " has" : " have";
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000)
                 .toISOString().slice(0,10);
const pretty = s => { const d = new Date(s + "T00:00:00");
  return isNaN(d) ? s : d.toLocaleDateString("en-GB",
    {weekday:"long", day:"numeric", month:"long", year:"numeric"}); };

const short = s => { const d = new Date(s + "T00:00:00");
  return isNaN(d) ? s : d.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"}); };
// "Oct 26 WK 40!row 5" is how the answer cites a row; on screen it reads as words.
const cite = s => String(s || "").replace("!row ", ", row ");
const nextWorkingDay = d => { const n = new Date(d);
  do { n.setDate(n.getDate() + 1); } while(n.getDay() === 0 || n.getDay() === 6); return n; };
const mondayOf = d => { const m = new Date(d); m.setDate(m.getDate() - (m.getDay() + 6) % 7); return m; };

function setStatus(text, kind=""){ const box = $("status");
  box.className = "status " + kind; box.textContent = text; }

async function get(path){
  const r = await fetch(path, {cache:"no-store", credentials:"same-origin"});
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(!r.ok){
    const e = new Error(typeof j.detail === "string" ? j.detail
                        : "Could not read the plan (" + r.status + ").");
    e.reason = r.headers.get("X-TTI-Reason") || "";
    throw e;
  }
  return j;
}

// ── One order line, drawn the same way in every view ────────────────────────
// Including the citation, always. A despatch answer somebody cannot check at
// source is an answer they have to take on trust, and they should not have to.
function card(line, parent, cls){
  // "Leaving on a day" names its date fields dispatch_cell / date_basis /
  // tentative; every other answer says departs_*. Read either, so that tab's
  // cards show the departure, why a date could not be read, and the flag.
  const departsCell = line.departs_cell || line.dispatch_cell;
  const departsBasis = line.departs_basis || line.date_basis;
  const tentative = line.departs_tentative || line.tentative;
  const c = el("div", null, parent, "card" + (cls ? " " + cls : ""));
  const h = el("h3", (line.order ? "Order " + line.order : "(no order number)")
                   + (line.customer_po ? "  ·  PO " + line.customer_po : ""), c);
  if(tentative) el("span", "tentative", h, "flag");
  if(line.loaded) el("span", "loaded", h, "flag good");
  if(line.overdue_by_days) el("span", line.overdue_by_days + " days overdue", h, "flag bad");
  if(line.slipped_by_days) el("span", line.slipped_by_days + " days ago", h, "flag bad");
  if(line.part || line.description)
    el("p", [line.part, line.description].filter(Boolean).join(" — "), c);
  if(line.because) el("p", line.because, c, "because");
  if(line.missing && line.missing.length)
    el("p", "Missing: " + line.missing.join("; "), c, "because");

  const bits = [];
  if(departsCell || departsBasis)
    bits.push("Lorry from SDI: " + (departsCell || "(blank)")
              + (departsBasis ? " — " + departsBasis : ""));
  if(line.due_cell) bits.push("Customer due: " + line.due_cell);
  if(line.qty) bits.push("qty " + line.qty);
  if(line.pallets_as_recorded != null && line.pallets_as_recorded !== "")
    bits.push("pallets as recorded: " + line.pallets_as_recorded);
  if(line.tti_account) bits.push("TTI " + line.tti_account);
  if(line.trailer) bits.push("Trailer: " + line.trailer);
  if(bits.length) el("p", bits.join("  ·  "), c, "meta");

  const paper = [];
  if(line.pick_note) paper.push("pick note " + line.pick_note);
  if(line.delivery_note) paper.push("delivery note " + line.delivery_note);
  if(line.invoice_number) paper.push("invoice " + line.invoice_number);
  if(line.booked_in_with_tti) paper.push("booked in: " + line.booked_in_with_tti);
  if(line.label_and_batch_done) paper.push("labels: " + line.label_and_batch_done);
  if(line.proof_of_export) paper.push("proof of export: " + line.proof_of_export);
  if(paper.length) el("p", paper.join("  ·  "), c, "meta");

  if(line.comments) el("p", "Comments: " + line.comments, c, "meta");
  el("p", cite(line.source), c, "meta");
  return c;
}

function lines(list, parent, cls){ for(const l of list || []) card(l, parent, cls); }

function foldaway(parent, label, list, truncated, cls, open){
  if(!list || !list.length) return;
  const d = el("details", null, parent); d.open = !!open;
  el("summary", label, d);
  lines(list, d, cls);
  if(truncated) el("p", "Only the first few are shown.", d, "hint");
}

function provenance(j){
  $("foot").textContent = "Plan last saved "
    + new Date(j.plan_saved).toLocaleString("en-GB")
    + "  ·  " + j.rows_read + " rows read"
    + (j.plan_reused_from_cache ? " (reusing this save's reading)" : "")
    + ".  This answer is only as current as that save.";
}

// ── The views: six questions about the plan, and the TTi folder search ──────
const VIEWS = {

day: {
  label: "Leaving on a day",
  tools: `<input id="day" type="date" aria-label="Day to look at">
          <button class="primary" data-run>What is leaving that day?</button>
          <button class="secondary" id="today">Today</button>
          <button class="secondary" id="tomorrow">Tomorrow</button>
          <button class="secondary" id="week">This week</button>`,
  week: false,
  ready(){
    // "Tomorrow" is the next working day: on a Friday it is Monday, and says so.
    // "This week" is Monday to Friday; at the weekend it is the week ahead.
    const today = new Date(), next = nextWorkingDay(today);
    const weekend = today.getDay() === 0 || today.getDay() === 6;
    const monday = weekend ? next : mondayOf(today);
    const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
    $("tomorrow").textContent = iso(next) === iso(tomorrow) ? "Tomorrow"
      : next.toLocaleDateString("en-GB", {weekday:"long"});
    $("week").textContent = weekend ? "Next week" : "This week";
    const pick = (d, week) => { VIEWS.day.week = week; $("day").value = iso(d); run(); };
    VIEWS.day.week = false;
    $("day").value = iso(today);
    $("tools").querySelector("[data-run]").onclick = () => { VIEWS.day.week = false; run(); };
    $("today").onclick = () => pick(today, false);
    $("tomorrow").onclick = () => pick(next, false);
    $("week").onclick = () => pick(monday, true);
    return true; },
  url(){ return "/api/tti/despatch/" + (this.week ? "week" : "day")
         + "?day=" + encodeURIComponent($("day").value); },
  guard(){ return $("day").value ? "" : "Pick a day first."; },
  draw(j){
    // ── "NOTHING IS LEAVING" IS ONLY SAFE WHEN NOTHING IS UNREADABLE ───────
    // A line whose date could not be interpreted cannot be ruled OUT of the
    // day being asked about. Saying "nothing is set to leave" over the top of
    // six such lines is an unqualified claim resting on the ones it could not
    // read - and that is the sentence somebody would act on.
    const unread = j.unresolved_date_count || 0;
    const when = j.days ? "between " + short(j.week_start) + " and " + short(j.week_end)
                        : "on " + pretty($("day").value);
    const pal = n => n + (n === 1 ? " pallet" : " pallets");
    setStatus(
      j.line_count
        ? some(j.line_count) + (j.pallet_total ? ", " + pal(j.pallet_total) + "," : "")
          + (j.line_count === 1 ? " is" : " are")
          + " planned to leave " + when + "."
          + (unread ? "  " + some(unread) + " could not be read, so this may not"
                      + " be all of them." : "")
        : unread
          ? "No confirmed matches " + when + ". " + some(unread)
            + " could not be read and cannot be ruled out — check those below"
            + " before relying on this."
          : "Nothing in the plan is set to leave " + when + ".",
      j.line_count && !unread ? "ok" : unread ? "error" : "");
    if(j.days){
      for(const d of j.days){
        el("h2", pretty(d.day) + " — " + (d.line_count ? some(d.line_count)
           + (d.pallet_total ? " · " + pal(d.pallet_total) : "") : "nothing planned"),
           $("out"), "dayhead");
        lines(d.lines, $("out"));
      }
    } else {
      lines(j.lines, $("out"));
    }
    const note = el("div", null, $("out"), "caveat");
    el("p", j.caveat, note);
    if(j.line_count){
      // "0 pallets" over a line whose PALLETS cell is empty reads as "nothing
      // to send". When nothing could be counted, say that, not a total of 0.
      const asText = (j.pallet_lines_as_text || []).map(t =>
        "“" + t.pallets_as_recorded + "”, " + cite(t.source)).join("; ");
      if(j.pallet_lines_counted){
        const left = [];
        if(asText) left.push(some(j.pallet_lines_as_text.length)
          + " with pallets written as text (" + asText + ")");
        if(j.pallet_lines_blank) left.push(some(j.pallet_lines_blank) + " with no pallet count");
        el("p", "Pallets: " + pal(j.pallet_total || 0) + ". " + j.pallet_total_reason
           + (left.length ? "  Not counted: " + left.join(", and ") + "." : ""), note, "hint");
      } else {
        el("p", "Pallets: no total. The PALLETS column has no number for "
           + (j.line_count === 1 ? "this line" : "these lines")
           + (asText ? " (written as text: " + asText + ")" : "") + ".", note, "hint");
      }
    }
    foldaway($("out"), some(unread) + have(unread)
      + " a date this cannot read — check these in the workbook",
      j.unresolved_date_lines, j.unresolved_date_truncated, "unresolved", !j.line_count);
    foldaway($("out"), some(j.no_date_count) + have(j.no_date_count)
      + " no departure date set yet (N/A, TBC, blank) — normal for work not yet planned",
      j.no_date_lines, j.no_date_truncated);
  }},

search: {
  label: "Search all weeks",
  tools: `<input id="q" type="search" maxlength="80"
            placeholder="Order number, customer PO, part code or TTI account"
            aria-label="Search the plan">
          <button class="primary" data-run>Search</button>`,
  ready(){ $("q").addEventListener("keydown", e => { if(e.key === "Enter") run(); });
    $("q").focus(); return false; },
  url(){ return "/api/tti/despatch/search?q=" + encodeURIComponent($("q").value.trim()); },
  guard(){ return $("q").value.trim() ? "" : "Type something to search for."; },
  draw(j){
    setStatus(j.match_count
      ? some(j.match_count) + " across the weekly sheets match “" + j.searched_for + "”."
        + (j.mention_count ? "  " + j.mention_count + " more mention it." : "")
      : j.mention_count
        ? "No line's order number, PO, part code or account is “" + j.searched_for
          + "”, but " + some(j.mention_count) + " mention it — usually in the comments."
        : "Nothing in any of the weekly sheets matches “" + j.searched_for + "”.",
      j.match_count ? "ok" : "");
    lines(j.matches, $("out"));
    if(j.matches_truncated) el("p", "Only the first 60 are shown.", $("out"), "hint");
    foldaway($("out"), some(j.mention_count) + " mention it elsewhere on the line"
      + " (usually the comments)", j.mentions, j.mentions_truncated, null, !j.match_count);
    el("p", j.note, $("out"), "hint");
  }},

chase: {
  label: "Chase list",
  tools: `<button class="primary" data-run>What is blocked?</button>
          <label class="hint" for="horizon">Chase paperwork for departures within</label>
          <input id="horizon" type="number" min="0" max="90" value="7" style="width:76px">
          <span class="hint">days</span>`,
  ready(){ $("horizon").addEventListener("change", run); return true; },
  url(){ return "/api/tti/despatch/chase?horizon="
                + encodeURIComponent($("horizon").value || 7); },
  draw(j){
    setStatus(j.line_count
      ? j.line_count + " item(s) to chase, under " + j.group_count + " heading(s)."
      : "Nothing is blocked on the measures this checks.",
      j.line_count ? "error" : "ok");
    for(const g of j.groups || []){
      el("h2", g.heading, $("out")).append(
        Object.assign(document.createElement("span"),
                      {className:"n", textContent:"  ·  " + g.count}));
      lines(g.lines, $("out"), "unresolved");
    }
    el("p", j.note, $("out"), "hint");
  }},

overdue: {
  label: "Overdue, no departure",
  tools: `<button class="primary" data-run>Which were never updated?</button>`,
  url(){ return "/api/tti/despatch/overdue"; },
  draw(j){
    setStatus(j.line_count
      ? some(j.line_count) + " have a customer due date in the past and no planned"
        + " departure — these are the ones nobody updated."
      : "No line has a customer due date in the past with the departure cell empty.",
      j.line_count ? "error" : "ok");
    lines(j.lines, $("out"), "unresolved");
    if(j.truncated) el("p", "Only the first 100 are shown.", $("out"), "hint");
    const note = el("div", null, $("out"), "caveat");
    el("p", j.note, note);
    if(j.unreadable_due_date_count)
      el("p", j.unreadable_due_date_count + " further line(s) have no planned departure"
        + " AND a due date this cannot read, so they are neither included nor ruled"
        + " out here. They are in Data quality.", note, "hint");
  }},

morning: {
  label: "Morning summary",
  tools: `<input id="mday" type="date" aria-label="Day to summarise">
          <button class="primary" data-run>Build the summary</button>
          <button class="secondary" id="copy" type="button">Copy as text</button>`,
  ready(){ $("mday").value = iso(new Date());
    $("copy").onclick = async () => {
      const text = window._summaryText || "";
      if(!text){ setStatus("Build the summary first."); return; }
      try{ await navigator.clipboard.writeText(text);
           setStatus("Copied. Paste it into an email.", "ok"); }
      catch(e){ setStatus("This browser would not let the page copy. Select the text"
                          + " below and copy it by hand."); }
    };
    return true; },
  url(){ return "/api/tti/despatch/morning?day=" + encodeURIComponent($("mday").value); },
  guard(){ return $("mday").value ? "" : "Pick a day first."; },
  draw(j){
    window._summaryText = j.as_text || "";
    setStatus(j.due_out_count
      ? some(j.due_out_count) + " due out on " + pretty(j.day)
        + (j.incomplete_count ? ", " + j.incomplete_count + " of them with something"
                                + " missing" : "")
        + (j.slipped_count ? ", and " + some(j.slipped_count) + " planned to have"
                             + " left earlier and not invoiced." : ".")
      : "Nothing is due out on " + pretty(j.day) + "."
        + (j.slipped_count ? "  " + some(j.slipped_count) + " planned to have left"
                             + " earlier and not invoiced." : ""),
      j.slipped_count || j.incomplete_count ? "error" : j.due_out_count ? "ok" : "");

    // ── THE TEXT IS THE PRODUCT, NOT A FOOTNOTE ──────────────────────────
    // Sue asked for an email. Nothing here sends it, so the words have to be
    // right in front of her, ready to paste, rather than reassembled by eye
    // out of three lists further down the page.
    el("h2", "As it would be emailed", $("out"));
    el("pre", j.as_text, $("out"));
    el("p", "Nothing here sends email. Which mailbox a daily despatch summary leaves"
       + " from, and who is on it, is yours to decide — this gives you the words.",
       $("out"), "hint");

    if(j.due_out_count){ el("h2", "Due out", $("out")); lines(j.due_out, $("out")); }
    if(j.slipped_count){
      el("h2", "Planned to have left, not invoiced", $("out"));
      lines(j.slipped, $("out"), "unresolved"); }
    foldaway($("out"), some(j.unreadable_date_count) + have(j.unreadable_date_count)
      + " a departure date this cannot read", j.unreadable_date_lines, false, "unresolved");
    el("p", j.note, $("out"), "hint");
  }},

quality: {
  label: "Data quality",
  tools: `<button class="primary" data-run>Check the workbook</button>`,
  url(){ return "/api/tti/despatch/quality"; },
  draw(j){
    setStatus(j.problem_count
      ? j.problem_count + " cell(s) cannot be read or disagree with each other."
      : "Nothing in the workbook is unreadable on the checks this makes.",
      j.problem_count ? "error" : "ok");
    for(const g of j.groups || []){
      el("h2", g.heading, $("out")).append(
        Object.assign(document.createElement("span"),
                      {className:"n", textContent:"  ·  " + g.count}));
      for(const item of g.lines){
        const c = el("div", null, $("out"), "card unresolved");
        el("h3", (item.order ? "Order " + item.order : "(no order number)")
               + (item.part ? "  ·  " + item.part : ""), c);
        el("p", item.what, c, "because");
        el("p", cite(item.source), c, "meta");
      }
      if(g.truncated) el("p", "Only the first 40 are shown.", $("out"), "hint");
    }
    if(j.duplicate_count){
      el("h2", "The same order and part on more than one row", $("out")).append(
        Object.assign(document.createElement("span"),
                      {className:"n", textContent:"  ·  " + j.duplicate_count}));
      for(const d of j.duplicate_order_lines){
        const c = el("div", null, $("out"), "card");
        el("h3", "Order " + d.order + "  ·  part " + d.part, c);
        el("p", d.count + " rows: " + d.sources.map(cite).join("; "), c, "meta");
      }
    }
    if(j.spelling_correction_count){
      el("h2", "Month spellings this corrected and used", $("out")).append(
        Object.assign(document.createElement("span"),
                      {className:"n", textContent:"  ·  "
                       + j.spelling_correction_count}));
      for(const s of j.spelling_corrections){
        const c = el("div", null, $("out"), "card");
        el("h3", (s.order ? "Order " + s.order : "(no order number)"), c);
        el("p", s.column + " reads “" + s.cell + "” and was read as " + s.read_as
              + " — " + s.basis + ". Fix the cell rather than relying on this.",
           c, "because");
        el("p", cite(s.source), c, "meta");
      }
    }
    el("p", j.note, $("out"), "hint");
  }},

// ── Liam's project tracker, from his SharePoint, read as you ────────────────
projects: {
  label: "Project tracker",
  busy: "Reading the project tracker from SharePoint…",
  tools: `<input id="pq" type="search" maxlength="80"
            placeholder="Filter: any words in a row (a name, a part, a status)"
            aria-label="Filter the project tracker">
          <button class="secondary" data-run>Refresh</button>`,
  data: null,
  ready(){ $("pq").addEventListener("input", () => {
      if(VIEWS.projects.data){ $("out").replaceChildren(); VIEWS.projects.draw(VIEWS.projects.data); } });
    return true; },
  url(){ return "/api/tti/despatch/projects"; },
  draw(j){
    VIEWS.projects.data = j;
    const words = $("pq").value.toLowerCase().split(/\s+/).filter(Boolean);
    let total = 0, shown = 0;
    for(const t of j.trackers || []) for(const f of t.files || []){
      el("h2", t.label + " — " + f.name, $("out"), "dayhead");
      const about = el("p", "Last saved " + (f.saved ? new Date(f.saved).toLocaleString("en-GB") : "?") + ".  ",
                       $("out"), "hint");
      if(f.web_url){ const a = el("a", "Open it in SharePoint", about); a.href = f.web_url; a.target = "_blank"; a.rel = "noopener"; }
      for(const sh of f.sheets || []){
        const rows = sh.rows.filter(r => words.every(w =>
          (sh.sheet + " " + Object.values(r.cells).join(" ")).toLowerCase().includes(w)));
        total += sh.rows.length; shown += rows.length;
        if(!rows.length && words.length) continue;
        el("h3", sh.sheet + "  ·  " + rows.length + (rows.length === 1 ? " row" : " rows"), $("out"));
        for(const r of rows){
          const c = el("div", null, $("out"), "card");
          const vals = Object.values(r.cells);
          el("h3", vals.slice(0, 2).join("  ·  ") || "(row " + r.row + ")", c);
          for(const [k, v] of Object.entries(r.cells).slice(2))
            el("p", k + ": " + v, c, "meta");
          for(const p of r.paths || []){
            const line = el("p", null, c);
            if(p.is_file){
              const open = el("a", "Open", line, "primary");
              open.href = "/api/tti/despatch/files/open?path=" + encodeURIComponent(p.path);
              open.target = "_blank"; open.rel = "noopener";
            } else {
              const find = el("button", "Find in TTi files", line, "secondary");
              find.type = "button";
              find.onclick = () => { show("files"); $("fq").value = p.path.split(/[\\/]/).filter(Boolean).pop() || p.path; run(); };
            }
            // The path beside the button only when the cell does not already show it
            // (a hyperlink labelled "see drawing", say).
            if(!vals.some(v => v.replace(/\//g, "\\").includes(p.path)))
              el("span", "  " + p.path, line, "meta");
          }
          el("p", f.name + " › " + sh.sheet + " › row " + r.row, c, "meta");
        }
      }
    }
    setStatus(words.length
      ? shown + " of " + total + " rows have “" + words.join(" ") + "”."
      : total + (total === 1 ? " row" : " rows") + " in the project tracker.", shown ? "ok" : "");
  },
  foot(){ $("foot").textContent = "Read from SharePoint as you, just now. Nothing here changes the tracker."; }},

// ── Liam's TTi folders: names only, from an index built on a schedule ──────
files: {
  label: "Find TTi files",
  busy: "Searching the TTi folders…",
  tools: `<input id="fq" type="search" maxlength="80"
            placeholder="Job, drawing or part number, or a product name"
            aria-label="Search the TTi folders">
          <select id="ffolder" aria-label="Which folder"><option value="">All folders</option>
            <option>Design</option><option>Production</option><option>Prototype</option></select>
          <select id="fkind" aria-label="Which kind of file"><option value="">Any kind</option>
            <option value="drawings">Drawings (PDF, DXF, DWG)</option>
            <option value="models">3D models (SolidWorks, STEP)</option>
            <option value="images">Images</option><option value="documents">Documents</option>
            <option value="folders">Folders only</option></select>
          <button class="primary" data-run>Find files</button>`,
  ready(){ $("fq").addEventListener("keydown", e => { if(e.key === "Enter") run(); });
    $("fq").focus();
    get("/api/tti/despatch/files/status").then(st => {
      const sel = $("ffolder");
      if(sel && st.folders && st.folders.length){
        sel.replaceChildren(el("option", "All folders"));
        sel.firstChild.value = "";
        for(const f of st.folders) el("option", f.label, sel).value = f.label;
      }
      setStatus("Ready. Searches " + (st.entries || 0).toLocaleString("en-GB")
                + " files and folders by name.");
      VIEWS.files.foot(st);
    }).catch(e => setStatus(e.message, "error"));
    return false; },
  url(){ return "/api/tti/despatch/files?q=" + encodeURIComponent($("fq").value.trim())
         + "&folder=" + encodeURIComponent($("ffolder").value)
         + "&kind=" + encodeURIComponent($("fkind").value); },
  guard(){ return $("fq").value.trim() ? "" : "Type part of a file or folder name."; },
  draw(j){
    const n = j.match_count, shown = j.matches.length;
    setStatus(n ? n.toLocaleString("en-GB") + (n === 1 ? " file or folder matches" : " files and folders match")
                  + " “" + j.searched_for + "”." + (n > shown ? "  Showing the best " + shown + "." : "")
                : "Nothing in the TTi folders has “" + j.searched_for + "” in its name or path.",
              n ? "ok" : "");
    for(const m of j.matches){
      const c = el("div", null, $("out"), "card");
      const h = el("h3", m.name, c);
      if(m.is_folder) el("span", "folder", h, "flag");
      const path = el("p", m.path, c, "meta");
      path.style.wordBreak = "break-all";
      if(!m.is_folder){
        const open = el("a", "Open", c, "primary");
        open.href = "/api/tti/despatch/files/open?path=" + encodeURIComponent(m.path);
        open.target = "_blank"; open.rel = "noopener";
      }
      const copy = el("button", "Copy path", c, "secondary");
      copy.type = "button";
      copy.onclick = () => navigator.clipboard.writeText(m.path)
        .then(() => { copy.textContent = "Copied"; }, () => { copy.textContent = "Select and copy the path above"; });
      const bits = [m.folder, m.kind];
      if(m.size != null) bits.push(m.size >= 1048576 ? (m.size / 1048576).toFixed(1) + " MB"
                                   : Math.max(1, Math.round(m.size / 1024)) + " KB");
      bits.push("modified " + new Date(m.modified).toLocaleDateString("en-GB",
                {day:"numeric", month:"short", year:"numeric"}));
      el("p", bits.join("  ·  "), c, "meta");
    }
    el("p", j.note + "  Open shows a PDF or picture in a new tab and downloads anything else; "
       + "nothing here changes, moves or deletes a file.", $("out"), "hint");
  },
  foot(j){
    const built = j.index_built || j.built;
    $("foot").textContent = built
      ? "Index of the TTi folders built " + new Date(built).toLocaleString("en-GB")
        + ".  Files added since are not in it yet.  Names only, not file contents."
      : "";
  }}
};

let current = "day";

async function run(){
  const view = VIEWS[current];
  const stop = view.guard ? view.guard() : "";
  if(stop){ setStatus(stop); return; }
  for(const b of document.querySelectorAll("[data-run]")) b.disabled = true;
  $("out").replaceChildren(); $("foot").textContent = "";
  setStatus(view.busy || "Reading the Despatch Plan…");
  try{
    const j = await get(view.url());
    view.draw(j);
    (view.foot || provenance)(j);
  }catch(e){
    setStatus(e.message, "error");
    // ── NOT ON SUE'S SITE IS NOT A BROKEN APP ──────────────────────────────
    // Liam and Callum are on the TTI list for the drawings and cannot open the
    // Despatch Plan. Every despatch tab said only "error"; this says what still
    // works and what would open the rest.
    if(e.reason === "access" && current !== "files"){
      const tracker = current === "projects";
      const note = el("div", null, $("out"), "caveat");
      el("p", (tracker ? "This tab reads the project tracker in the TTi Projects SharePoint site"
                       : "This tab reads Sue's TTI Despatch Plan in SharePoint")
         + " as you, and your account cannot open it, so there is nothing to show here. That is "
         + "about access to the file, not a fault in the app.", note);
      el("p", "Find TTi files does not need it: drawings and files in the TTi folders on W: work "
         + "for you now. " + (tracker ? "For the tracker, ask Liam to share it with you."
                                      : "For the despatch tabs, ask Sue to share the plan with you."),
         note, "hint");
      const go = el("button", "Go to Find TTi files", note, "primary");
      go.type = "button"; go.style.marginTop = "10px"; go.onclick = () => show("files");
    }
  }finally{
    for(const b of document.querySelectorAll("[data-run]")) b.disabled = false;
  }
}

function show(name){
  current = name;
  // The tab is in the address (…/despatch#files), so a link can open straight on it.
  try{ history.replaceState(null, "", "#" + name); }catch(e){}
  for(const b of $("tabs").children)
    b.setAttribute("aria-selected", String(b.dataset.view === name));
  $("tools").innerHTML = VIEWS[name].tools;
  for(const b of document.querySelectorAll("[data-run]")) b.onclick = run;
  $("out").replaceChildren(); $("foot").textContent = "";
  const auto = VIEWS[name].ready ? VIEWS[name].ready() : true;
  if(auto) run(); else setStatus("Ready.");
}

for(const [name, view] of Object.entries(VIEWS)){
  const b = el("button", view.label, $("tabs"), "tab");
  b.type = "button"; b.dataset.view = name;
  b.setAttribute("role", "tab"); b.setAttribute("aria-selected", "false");
  b.onclick = () => show(name);
}
show(VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "day");
</script>
</body>
</html>
