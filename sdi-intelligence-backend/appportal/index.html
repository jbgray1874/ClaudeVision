<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SDI Intelligence">
<title>SDI Intelligence</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
<style>
  /* ── we.are.sdi (9 Nov 2026, James: "the look and feel of the web app portal page ... in line with
     the we are sdi style of fonts etc", as the estimating pages and the wall, D-754). The site's look
     on the dark ground: the lower-case wordmark with its two dots in SDI yellow, a geometric sans for
     headings (Outfit, kin to the site's licensed Sofia Pro), an elegant serif for the tagline
     (Fraunces light, for its Juana), pill buttons, a halftone dot circle, and the short yellow line
     over each panel that the wall carries. Warnings keep their amber, so a warning never reads as
     brand. Tokens as the estimating page has them. */
  :root{
    --bg:#0c0c0b; --panel:#141412; --panel-2:#1a1a17; --line:#2b2b26; --line-soft:#21211d;
    --ink:#f2f2ea; --muted:#b6b6a7; --dim:#8f8f84;
    --brand:#F6D946; --brand-fill:#F6D946; --ok:#4ec97f; --warn:#e8a33d; --bad:#ff6b6b;
    --disp:'Outfit','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --serif-disp:'Fraunces',Georgia,serif;
    --r:10px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--body);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    min-height:100vh; overflow-wrap:anywhere; overflow-x:hidden;
  }
  a{color:var(--brand);text-decoration:none}

  .sdi-word{display:inline-block;height:1em;width:auto;vertical-align:-.12em;color:var(--ink)}
  .sdi-word .d{fill:var(--brand)}
  .sdi-dots{position:absolute;pointer-events:none;border-radius:50%;opacity:.16;z-index:0;
    background-image:radial-gradient(var(--brand) 1.1px, transparent 1.6px);background-size:9px 9px;
    -webkit-mask-image:radial-gradient(circle at center,#000 58%,transparent 71%);
            mask-image:radial-gradient(circle at center,#000 58%,transparent 71%)}

  /* ---------- Header ---------- */
  .top{
    position:sticky;top:0;z-index:20;background:rgba(12,12,11,.9);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
    padding:calc(14px + var(--safe-t)) 16px 14px;
  }
  /* The header lines up with the apps below it: the same left edge, the search as wide as the list. */
  .top .in{max-width:1148px;margin:0 auto}
  .bar{display:flex;align-items:center;gap:12px;min-height:34px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .sdi-word{height:22px}
  .brand .pipe{width:1px;height:20px;background:var(--line);flex:none}
  .brand .lbl{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.22em;
    color:var(--brand);text-transform:uppercase;white-space:nowrap}
  .back{
    display:none;align-items:center;gap:7px;background:none;border:0;color:var(--muted);
    font-family:var(--body);font-size:14px;cursor:pointer;padding:6px 2px
  }
  .back svg{width:17px;height:17px}
  .back:hover{color:var(--ink)}
  body.detail .back{display:flex}
  body.detail .brand{display:none}

  .search{
    display:block;margin-top:14px;width:100%;max-width:980px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;color:var(--ink);font-family:var(--body);font-size:15px;
    padding:11px 18px;outline:none;transition:border-color .15s
  }
  .search:focus{border-color:var(--brand)}
  .search::placeholder{color:var(--dim)}
  body.detail .search{display:none}

  .who{
    display:none;margin-top:10px;font-family:var(--mono);font-size:10.5px;
    color:var(--dim);letter-spacing:.06em;align-items:center;gap:8px
  }
  .who.on{display:flex}
  .who b{color:var(--muted);font-weight:500}
  .who a{color:var(--dim);text-decoration:underline}
  body.detail .who{display:none}

  /* ---------- The opening: the site's tagline over a halftone circle ---------- */
  .hero{position:relative;padding:26px 2px 6px;max-width:980px}
  .hero > :not(.sdi-dots){position:relative;z-index:1}
  .hero .sdi-dots{width:240px;height:240px;right:-70px;top:-60px}
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .eyebrow::before{content:"";width:26px;height:2px;background:var(--brand);flex:none}
  .tagline{font-family:var(--serif-disp);font-weight:300;font-size:clamp(30px,7.4vw,46px);
    line-height:1.06;letter-spacing:-.01em;margin:12px 0 10px}
  .tagline em{font-style:normal;color:var(--brand)}
  .hero p{color:var(--muted);font-size:14.5px;max-width:560px}
  body.detail .hero{display:none}

  /* ---------- Layout ---------- */
  /* Clipped: the halftone circle hangs off the right of the heading, and on a 390px phone it widened the
     page to 444px, so the page could be dragged sideways (found by the SCRUM-195 checks). */
  .wrap{padding:6px 16px calc(28px + var(--safe-b));max-width:1180px;margin:0 auto;overflow-x:hidden;overflow-x:clip}
  .grp{
    display:flex;align-items:center;gap:10px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--dim);
    text-transform:uppercase;margin:26px 0 10px
  }
  .grp::before{content:"";width:18px;height:2px;background:var(--brand);flex:none}
  .grp:first-child{margin-top:14px}

  /* One column on a phone; a grid once there is room. Category headings span
     the full width so the grouping still reads on a laptop. */
  #list{display:grid;grid-template-columns:1fr;gap:12px;align-content:start}
  #list .grp{grid-column:1/-1}
  /* TWO ACROSS, NEVER THREE. Five apps in threes left one card alone on its row and the
     estimating card alone under its own heading — "randomly scattered". Two columns read as
     a tidy grid at any width, and the list is held to a readable width on a wide screen. */
  @media (min-width:680px){ #list{grid-template-columns:1fr 1fr;max-width:980px} }
  /* The first app under a heading takes the full row — Estimating, the one the rest of the
     programme hangs off — so five apps read one, two, two rather than leaving one alone. */
  @media (min-width:680px){ #list .grp + .card{grid-column:1/-1} }

  .card{
    position:relative;display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 16px;cursor:pointer;
    font-family:var(--body);color:var(--ink);transition:border-color .15s,background .15s
  }
  /* The short yellow line over each panel, as the wall has it. */
  .card::before,.note::before{content:"";position:absolute;top:-1px;left:16px;width:30px;height:2px;
    background:var(--brand);border-radius:0 0 2px 2px}
  .card:hover{border-color:#4a4421;background:var(--panel-2)}
  .card:active{transform:scale(.995)}
  .card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .card .ch{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .card .nm{font-family:var(--disp);font-weight:600;font-size:18px;line-height:1.25;letter-spacing:-.005em}
  .card .ds{color:var(--muted);font-size:13.5px;margin-top:7px}
  /* Says what you cannot do from this device, rather than hiding the app. */
  .req{font-family:var(--mono);font-size:10px;color:var(--warn);letter-spacing:.04em;
       margin-top:11px;padding-top:9px;border-top:1px solid var(--line-soft)}
  /* An app with a screen opens from its own square; the rest of the square still
     opens the detail page. */
  .card .gos{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .card .go,.btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand-fill);color:#000;
       font-family:var(--disp);font-weight:600;font-size:14px;padding:9px 18px;border-radius:999px;
       border:1px solid var(--brand-fill);transition:filter .15s}
  .card .go:hover,.btn:hover{filter:brightness(1.06)}
  .card .go.ghost,.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .card .go.ghost:hover,.btn.ghost:hover{border-color:var(--muted)}

  .chip{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;white-space:nowrap;flex:none;border:1px solid transparent
  }
  .c-done{background:rgba(78,201,127,.1);color:var(--ok);border-color:rgba(78,201,127,.3)}
  .c-prog{background:rgba(246,217,70,.1);color:var(--brand);border-color:rgba(246,217,70,.3)}
  .c-plan{background:rgba(182,182,167,.08);color:var(--muted);border-color:var(--line)}

  /* ---------- Detail ---------- */
  #detail{display:none;max-width:720px;padding-top:18px}
  body.detail #detail{display:block}
  body.detail #list{display:none}
  .kicker{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.22em;color:var(--brand);text-transform:uppercase}
  .kicker::before{content:"";width:26px;height:2px;background:var(--brand);flex:none}
  h1{font-family:var(--disp);font-weight:600;font-size:clamp(26px,6vw,34px);line-height:1.12;
    margin:10px 0 10px;letter-spacing:-.015em}
  .sub{color:var(--muted);font-size:15px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .note{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:16px;margin-top:14px}
  .note.warnbox{border-color:rgba(232,163,61,.35);background:rgba(232,163,61,.06)}
  .note.warnbox::before{background:var(--warn)}
  .note h4{
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);
    text-transform:uppercase;font-weight:500;margin-bottom:9px
  }
  .note p,.note div{font-size:14px;color:var(--muted)}
  .note b{color:var(--ink)}
  .body-txt{font-size:14.5px;color:var(--muted);margin-top:14px}
  .body-txt b{color:var(--ink)}
  ul{margin:6px 0 0 18px}
  li{margin:4px 0;font-size:14px;color:var(--muted)}
  code{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);padding:1px 5px;border-radius:4px;color:var(--brand)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .tag{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);
       color:var(--muted);padding:4px 10px;border-radius:999px}
  .btn{margin-top:18px;margin-right:8px}

  .msg{color:var(--dim);font-size:14px;padding:26px 2px;text-align:center}
  .banner{
    background:rgba(232,163,61,.1);border:1px solid rgba(232,163,61,.3);color:var(--warn);
    border-radius:var(--r);padding:10px 14px;font-size:13px;margin:14px 0 4px
  }
  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
        margin-top:34px;padding-top:16px;border-top:1px solid var(--line-soft);
        font-size:11px;color:var(--dim);font-family:var(--mono);letter-spacing:.05em}
  .foot .sdi-word{height:13px;color:var(--muted)}
</style>
</head>

<script>
// The catalogue is the same services.json the intranet portal renders from.
// No API key lives in this page — access control belongs in front of the service.
const ORDER=['Live & in-flight','Co-worker agents','Pipeline','Customer-facing','Internal tools','Meta'];
let SERVICES=[], offline=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  try{
    // Never hang on "Loading…" — a stalled network falls through to the cache.
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),8000);
    let r;
    try{ r=await fetch('../api/services?surface=app',{cache:'no-cache',signal:ctl.signal}); }
    finally{ clearTimeout(timer); }
    if(r.status===401){ location.href='/auth/login?next='+encodeURIComponent('/app/'); return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    SERVICES=d.services||[];
    try{ localStorage.setItem('sdi.catalogue',JSON.stringify(SERVICES)); }catch(e){}
  }catch(e){
    let cached=null;
    try{ cached=localStorage.getItem('sdi.catalogue'); }catch(e2){}
    if(cached){ SERVICES=JSON.parse(cached); offline=true; }
    else{ $('list').innerHTML='<div class="msg">Couldn\'t reach the SDI Intelligence service.<br>'
        +'Check you\'re on the SDI network or VPN, then pull to refresh.</div>'; return; }
  }
  whoami();
  if(offline) $('banner').innerHTML='<div class="banner">Offline — showing the last catalogue this device downloaded.</div>';
  $('foot').textContent=SERVICES.length+' apps · '+(offline?'cached':'live');
  renderList();
  route();
}

function renderList(filter){
  const f=(filter||'').trim().toLowerCase();
  const hits=SERVICES.filter(s=>!f
    || s.name.toLowerCase().includes(f)
    || (s.desc||'').toLowerCase().includes(f)
    || (s.tech||[]).join(' ').toLowerCase().includes(f)
    || (s.status||'').toLowerCase().includes(f));
  if(!hits.length){ $('list').innerHTML='<div class="msg">No apps match “'+esc(f)+'”.</div>'; return; }

  // The launcher's own heading where an app names one (app_category), so every app can sit
  // under one heading here while the intranet portal keeps its programme categories.
  const catOf=s=>s.app_category||s.category;
  const cats=[...new Set(hits.map(catOf))]
    .sort((a,b)=>(ORDER.indexOf(a)+1||99)-(ORDER.indexOf(b)+1||99));
  let h='';
  cats.forEach(cat=>{
    h+='<div class="grp">'+esc(cat)+'</div>';
    hits.filter(s=>catOf(s)===cat).forEach(s=>{
      // A div, not a button: a square with its own Open link cannot be a button,
      // since a link inside a button is invalid and browsers handle it differently.
      h+='<div class="card" role="button" tabindex="0" data-open="'+esc(s.id)+'">'
        +'<div class="ch"><span class="nm">'+esc(s.name)+'</span>'
        +'<span class="chip '+esc(s.cls||'c-plan')+'">'+esc(s.status||'')+'</span></div>'
        +(s.desc?'<div class="ds">'+esc(s.desc)+'</div>':'')
        +(s.requires?'<div class="req">'+esc(s.requires)+'</div>':'')
        +((s.app_url||s.guide_url)?'<div class="gos">'
          +(s.app_url?'<a class="go" href="'+esc(s.app_url)+'">Open '+esc(s.name.split(' · ')[0])+' \u2192</a>':'')
          +(s.guide_url?'<a class="go ghost" href="'+esc(s.guide_url)+'">User guide</a>':'')+'</div>':'')
        +'</div>';
    });
  });
  $('list').innerHTML=h;
}

function renderDetail(s){
  const list=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  const tags=a=>'<div class="tags">'+a.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';
  let h='<div class="kicker">SDI Intelligence app</div><h1>'+esc(s.name)+'</h1>';
  if(s.desc) h+='<p class="sub">'+esc(s.desc)+'</p>';
  h+='<div class="meta"><span class="chip '+esc(s.cls||'c-plan')+'">'+esc(s.status||'')+'</span>'
    +(s.phase?'<span class="chip c-plan">'+esc(s.phase)+'</span>':'')+'</div>';
  if(s.requires) h+='<div class="note warnbox"><h4>On this device</h4><div>'+esc(s.requires)+'</div></div>';
  if(s.detail)   h+='<div class="body-txt">'+s.detail+'</div>';
  if(s.sections) s.sections.forEach(x=>{ h+='<div class="note"><h4>'+esc(x.title)+'</h4><div>'+x.body+'</div></div>'; });
  if(s.inputs)   h+='<div class="note"><h4>Inputs</h4>'+list(s.inputs)+'</div>';
  if(s.outputs)  h+='<div class="note"><h4>Outputs</h4>'+list(s.outputs)+'</div>';
  if(s.tech)     h+='<div class="note"><h4>Built with</h4>'+tags(s.tech)+'</div>';
  if(s.invoke)   h+='<div class="note"><h4>How to use it</h4><div>'+s.invoke+'</div></div>';
  if(s.next)     h+='<div class="note"><h4>Next</h4><div>'+s.next+'</div></div>';
  if(s.app_url)  h+='<a class="btn" href="'+esc(s.app_url)+'">Open '+esc(s.name.split(' · ')[0])+' →</a>';
  if(s.guide_url) h+='<a class="btn ghost" href="'+esc(s.guide_url)+'">User guide</a>';
  // An app in BOTH portals carries `link` for the intranet; here app_url already opens it.
  if(s.link && s.link!==s.app_url) h+='<a class="btn ghost" href="'+esc(s.link)+'" target="_blank" rel="noopener">'+esc(s.linkLabel||'Open ↗')+'</a>';
  $('detail').innerHTML=h;
}

function open(id,skipHash){
  const s=SERVICES.find(x=>x.id===id); if(!s) return;
  renderDetail(s);
  document.body.classList.add('detail');
  window.scrollTo(0,0);
  if(!skipHash) location.hash=id;
}
function close(){
  document.body.classList.remove('detail');
  if(location.hash) history.pushState('',document.title,location.pathname+location.search);
}
function route(){
  const h=location.hash.replace('#','');
  if(h && SERVICES.find(x=>x.id===h)) open(h,true); else document.body.classList.remove('detail');
}

$('list').addEventListener('click',e=>{
  if(e.target.closest('a')) return;            // the square's Open link goes to the app
  const b=e.target.closest('[data-open]'); if(b) open(b.dataset.open);
});
$('list').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-open]')){ e.preventDefault(); open(e.target.dataset.open); }
});
$('back').addEventListener('click',close);
$('q').addEventListener('input',e=>renderList(e.target.value));
window.addEventListener('hashchange',route);

async function whoami(){
  try{
    const r=await fetch('../api/me',{cache:'no-store'});
    if(!r.ok) return;
    const m=await r.json();
    if(!m.signed_in) return;
    const el=$('who'); el.className='who on';
    el.innerHTML = m.sso_enabled
      ? '<b>'+esc(m.name)+'</b> · <a href="/auth/logout">sign out</a>'
      : '<b>Not signed in</b> · SSO is not configured on this server';
  }catch(e){}
}

load();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// 4 Nov 2026 (James, on his phone: "Open SameDay doesn't do anything - it just hangs"). An app on the office
// network (10.x, 172.16-31.x, 192.168.x) can't be reached from a phone outside the office: the browser just waits.
// So it is tried, and if it hasn't opened in 10 seconds the wait is stopped and the reason is said.
(function(){
  const OFFICE=/^http:\/\/(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/i;
  let box=null;
  function note(msg){
    if(!box){ box=document.createElement('div'); box.setAttribute('role','status');
      box.style.cssText='position:fixed;left:12px;right:12px;bottom:16px;z-index:999;max-width:560px;margin:0 auto;'
        +'padding:14px 16px;border-radius:12px;background:#141412;border:1px solid #2b2b26;color:#f2f2ea;'
        +'font:15px/1.45 Inter,system-ui,sans-serif;'
        +'box-shadow:0 8px 30px rgba(0,0,0,.35)';
      box.addEventListener('click',()=>{ box.remove(); box=null; });
      document.body.appendChild(box); }
    box.textContent=msg;
  }
  document.addEventListener('click',e=>{
    const a=e.target.closest&&e.target.closest('a[href]');
    if(!a||a.target==='_blank'||!OFFICE.test(a.href)||e.metaKey||e.ctrlKey||e.shiftKey) return;
    e.preventDefault();
    const name=(a.textContent||'').replace(/^\s*Open\s+/i,'').replace(/[\s→↗]+$/,'').trim()||'This app';
    note('Opening '+name+'…');
    const t=setTimeout(()=>{
      try{ window.stop(); }catch(_){}
      note(name+" didn't open from here. For now it only opens on the office network or the VPN, so on a phone "
        +"connect to the VPN first. Opening it from anywhere, with the microphone, comes with its secure address.");
    },10000);
    window.addEventListener('pagehide',()=>clearTimeout(t),{once:true});
    location.href=a.href;
  },true);
})();
</script>
