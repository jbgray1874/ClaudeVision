<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDI Private Assistant</title>
<style>body{font:17px system-ui;background:#edf2f6;color:#142337}main{max-width:950px;margin:40px auto;padding:24px}header{background:#102b43;color:white;padding:28px;border-radius:16px}button{background:#006e72;color:white;border:0;border-radius:6px;padding:12px;cursor:pointer}article{background:white;padding:20px;margin:16px 0;border-radius:12px}</style>
<main><header><h1>SDI Private Assistant</h1><p>Your mailbox · Read-only pilot</p></header><p>Seven-day message previews only. AI summaries, suggested replies, drafts and voice are not enabled yet.</p><button id="read">Read last seven days</button> <button id="logout">Sign out of private assistant</button><p id="status" role="status"></p><section id="messages"></section></main>
<script>
const root='/api/private-email', status=document.querySelector('#status'), list=document.querySelector('#messages');
function text(tag,value,parent){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e;}
document.querySelector('#read').onclick=async()=>{list.replaceChildren();status.textContent='Reading…';try{const r=await fetch(root+'/review',{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.detail||'Read failed');status.textContent=`${j.messages.length} messages. ${j.complete?'Date window retrieved.':'PARTIAL: retrieval limit reached.'} Previews are not full threads.`;for(const m of j.messages){const card=text('article','',list);text('h2',m.subject||'(No subject)',card);text('p',m.receivedDateTime,card);text('p',m.bodyPreview||'(No preview)',card);if(m.webLink){try{const u=new URL(m.webLink);if(u.protocol==='https:'&&['outlook.office.com','outlook.office365.com'].includes(u.hostname)){const a=text('a','Open in Outlook',card);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';}}catch{}}}}catch(e){status.textContent=e.message;}};
document.querySelector('#logout').onclick=async()=>{const r=await fetch(root+'/auth/logout',{method:'POST',headers:{'X-SDI-Private-Action':'1'}});if(r.ok){list.replaceChildren();document.querySelector('#read').disabled=true;document.querySelector('#logout').disabled=true;status.textContent='Signed out of the private assistant. Your shared portal session is unchanged.';const a=text('a','Sign in again',status);a.href=root+'/auth/login';}else status.textContent='Sign out failed; close this page and contact support.';};
</script></html>
