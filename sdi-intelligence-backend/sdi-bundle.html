<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filed estimate bundle</title>
<!-- ONE RUN'S FILED BUNDLE (13 Nov 2026). Opened from the link in a finished estimate's
     e-mail and filed covering note, and from Grid Control's completed-estimates list. It
     shows the run's folder on the AISheets share, checked now: each file, and each thing an
     estimate should have filed that is not there. Where the runner worked before it filed is
     shown last, for diagnosis only. Internal. -->
<style>
  :root{ --bg:#0c0c0b; --panel:#141412; --line:#2b2b26; --ink:#f2f2ea; --muted:#b6b6a7;
         --brand:#F6D946; --bad:#ff6b6b; --ok:#8fd694; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f4f2; --panel:#ffffff; --line:#d9d8d3; --ink:#17171a; --muted:#5b5b63;
           --brand:#8a6a00; --bad:#8a1f11; --ok:#1f6b2a; } }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  main{ max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
  h1{ font-size:22px; margin:0 0 4px; } h2{ font-size:16px; margin:22px 0 8px; }
  .muted{ color:var(--muted); } .bad{ color:var(--bad); font-weight:600; } .ok{ color:var(--ok); font-weight:600; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0; }
  table{ border-collapse:collapse; width:100%; } th,td{ text-align:left; padding:6px 10px 6px 0;
        border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
  a{ color:var(--brand); } .scroll{ overflow-x:auto; } code{ font-size:13px; word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1 id="title">Filed estimate bundle</h1>
  <p class="muted" id="ident"></p>
  <div class="panel" id="state"></div>
  <div id="missing"></div>
  <h2>Files in the bundle</h2>
  <div class="panel scroll"><table id="files"></table></div>
  <h2>Where it is</h2>
  <div class="panel"><p>On the share: <code id="folder"></code></p>
    <p class="muted">For diagnosis only, where the runner worked before it filed: <code id="working"></code></p></div>
</main>
<script>
const API_KEY = "";                       // set if SDI_API_KEY is enabled, as on the estimating page
const token = location.pathname.split("/").filter(Boolean).pop();
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const size = n => n == null ? "" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB";
fetch(`/api/estimate/bundle/${encodeURIComponent(token)}`, {headers: {"X-SDI-Key": API_KEY}}).then(async r => {
  if (!r.ok) { document.getElementById("ident").innerHTML =
      `<span class="bad">${esc((await r.json().catch(() => ({}))).detail || "This bundle link could not be opened.")}</span>`; return; }
  const v = await r.json(), c = v.verification || {};
  document.getElementById("title").textContent = `Filed estimate bundle: ${v.drawing_number}`;
  const when = v.finished_at ? new Date(v.finished_at * 1000).toLocaleString("en-GB") : "time not recorded";
  document.getElementById("ident").textContent = `${v.client} · run ${v.run_id || "not recorded"} · finished ${when}${v.units ? " · " + v.units + " off" : ""}`;
  document.getElementById("state").innerHTML =
      `<p class="${c.state === "verified" ? "ok" : "bad"}">Bundle ${esc(c.says || "not checked")}</p>`
      + '<p class="muted">Checked now, on the share: each file is present and not empty. Content is not compared with the runner\'s working copy.</p>';
  if ((v.missing || []).length) document.getElementById("missing").innerHTML =
      "<h2>Missing from the bundle</h2><div class='panel'><table><tr><th>What</th><th>File</th><th>Why</th></tr>"
      + v.missing.map(m => `<tr><td class="bad">${esc(m.what)}</td><td>${esc(m.name || "-")}</td><td class="muted">${esc(m.why)}</td></tr>`).join("") + "</table></div>";
  document.getElementById("files").innerHTML = "<tr><th>File</th><th>What it is</th><th>Size</th></tr>"
      + (v.files || []).map(f => `<tr><td><a href="/api/estimate/bundle/${encodeURIComponent(token)}/file/${encodeURIComponent(f.name)}">${esc(f.name)}</a></td>`
          + `<td class="muted">${esc(f.what || "")}</td><td class="${f.size === 0 ? "bad" : "muted"}">${f.size === 0 ? "EMPTY" : size(f.size)}</td></tr>`).join("");
  document.getElementById("folder").textContent = v.bundle_folder || "not recorded";
  document.getElementById("working").textContent = v.working_folder || "not recorded by this run";
});
</script>
</body>
</html>
