<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDI Private Assistant — Email</title>
<style>body{font:17px system-ui;background:#edf2f6;color:#142337;margin:0}main{max-width:980px;margin:40px auto;padding:24px}header{background:#102b43;color:white;padding:28px;border-radius:16px}button{background:#006e72;color:white;border:0;border-radius:6px;padding:12px;cursor:pointer}article{background:white;padding:20px;margin:16px 0;border-radius:12px}textarea{display:block;width:95%;min-height:100px;margin:12px 0}pre{white-space:pre-wrap}small{color:#526374}</style>
<main><header><small style="color:#a5e7df">SDI INTELLIGENCE · PRIVATE WORKSPACE</small><h1>Your email, under your control.</h1><p>Seven-day evidence review. Replies remain drafts. Nothing can be sent here.</p></header>
<p><strong>Foundation preview:</strong> AI priorities, thread analysis, voice and ChatGPT connection are not yet enabled.</p><button id="load">Read the last seven days</button><p id="status" role="status"></p><section id="messages"></section></main>
<script>
const root='/api/private-email', status=document.querySelector('#status'), list=document.querySelector('#messages');
async function api(path,data){const r=await fetch(root+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json','X-SDI-Private-Action':'1'}:{},body:data?JSON.stringify(data):undefined,cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j;}
function text(tag,value,parent){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e;}
document.querySelector('#load').onclick=async()=>{status.textContent='Reading…';list.replaceChildren();try{const result=await api('/review');status.textContent=`${result.messages.length} messages. ${result.complete?'Date-window retrieval complete.':'PARTIAL — retrieval limit reached.'} Previews only; outstanding decisions are not determined.`;for(const m of result.messages){const card=text('article','',list);text('h2',m.subject||'(No subject)',card);text('small',m.receivedDateTime,card);text('p',m.bodyPreview||'(No preview)',card);if(m.webLink){const u=new URL(m.webLink);if(u.protocol==='https:'&&['outlook.office.com','outlook.office365.com'].includes(u.hostname)){const a=text('a','Open source in Outlook',card);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';}}const body=text('textarea','',card);body.placeholder='Write or paste your proposed reply';body.setAttribute('aria-label','Reply for '+(m.subject||'message'));const prepare=text('button','Review draft before saving',card);prepare.onclick=async()=>{prepare.disabled=true;try{const p=await api('/proposals',{message_id:m.id,body:body.value});const box=text('section','',card);text('h3','Confirm this exact reply draft',box);text('p','To: '+p.recipients.map(x=>x.emailAddress.address).join(', '),box);text('pre',p.body,box);const save=text('button','Confirm — save to Outlook Drafts',box);save.onclick=async()=>{save.disabled=true;try{await api('/confirm',{proposal_id:p.proposal_id,digest:p.digest});text('p','Saved to Outlook Drafts. Not sent.',box);}catch(e){text('p',e.message+' Check Outlook before creating another proposal.',box);}};}catch(e){text('p',e.message,card);}finally{prepare.disabled=false;}}}}catch(e){status.textContent=e.message;}};
</script></html>
